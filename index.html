<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'App delle Risposte - Il Libro Magico</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1b1b3a 0%, #090915 100%);
            color: #f7f7f7;
            font-family: 'Cinzel', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Stelline magiche di sfondo */
        body::before {
            content: "✨";
            position: absolute;
            top: 10%;
            left: 15%;
            font-size: 14px;
            opacity: 0.6;
            animation: pulseStelle 3s infinite alternate;
        }
        body::after {
            content: "⭐";
            position: absolute;
            bottom: 15%;
            right: 20%;
            font-size: 12px;
            opacity: 0.4;
            animation: pulseStelle 4s infinite alternate;
        }

        @keyframes pulseStelle {
            0% { transform: scale(0.8); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        .app-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            background: #fcf9f2; /* Colore carta antica */
            color: #2c2c2c;
            border: 2px solid #d4af37; /* Bordo oro */
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(212, 175, 55, 0.15);
            position: relative;
        }

        /* Decorazioni angolari della pagina del libro */
        .app-container::before, .app-container::after {
            content: "❖";
            position: absolute;
            color: #d4af37;
            font-size: 16px;
        }
        .app-container::before { top: 10px; left: 10px; }
        .app-container::after { top: 10px; right: 10px; }

        h1 {
            font-size: 22px;
            color: #2c2c2c;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .sottotitolo-titolo {
            font-size: 11px;
            color: #8c7853;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .selector-box {
            margin-bottom: 20px;
        }
        select {
            background: #fff;
            color: #2c2c2c;
            border: 1px solid #d4af37;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            font-weight: 600;
        }

        /* Stile Libro Magico Centrale */
        .display-box {
            background: #f4eee1;
            border-radius: 12px;
            padding: 25px 15px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid #e2d3b8;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            perspective: 1000px;
        }

        /* Effetto Sfoglia Pagina (Animazione 3D) */
        .display-box.sfoglia {
            transform: rotateY(180deg) scale(0.95);
            opacity: 0.2;
        }
        
        .libro-icona {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #2c2c2c, #111);
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            position: relative;
        }
        .libro-icona::after {
            content: "✦";
            color: #ffd700;
            animation: piastraLuce 2s infinite alternate;
        }

        @keyframes piastraLuce {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 10px #ffd700; }
        }

        #risposta {
            font-size: 17px;
            font-style: italic;
            color: #4a4a4a;
            line-height: 1.5;
            margin: 0;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button, .btn-link {
            background: linear-gradient(135deg, #e6c56b 0%, #c59b27 100%);
            color: #1a1a2e;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(197, 155, 39, 0.4);
            transition: transform 0.2s, filter 0.2s;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        button:hover, .btn-link:hover {
            filter: brightness(1.05);
        }
        button:active, .btn-link:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: #eae2d0;
            color: #5c4e31;
            box-shadow: none;
            border: 1px solid #d4af37;
        }

        .btn-stripe {
            background: linear-gradient(135deg, #635bff, #00d4ff);
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(99, 91, 255, 0.4);
        }

        .badge-giorno {
            font-size: 11px;
            background: #d4af37;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Sezione codice sblocco */
        .sezione-codice {
            margin-top: 10px;
            background: #f4eee1;
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #d4af37;
        }
        .sezione-codice input {
            background: #fff;
            border: 1px solid #d4af37;
            padding: 9px;
            color: #2c2c2c;
            border-radius: 6px;
            width: 65%;
            font-size: 13px;
            outline: none;
            text-transform: uppercase;
            font-weight: bold;
        }
        .sezione-codice button {
            width: 30%;
            padding: 9px 5px;
            font-size: 12px;
            border-radius: 6px;
            display: inline-block;
            box-shadow: none;
        }

        .downloads-badge {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }
        .downloads-badge span {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Il Libro delle Risposte</h1>
        <div class="sottotitolo-titolo">~ Oracolo Antico ~</div>
        
        <div class="selector-box">
            <select id="mazzoScelto">
                <option value="mistico">🔮 Mistico & Universale</option>
                <option value="lavoro">💼 Lavoro & Carriera</option>
                <option value="amore">❤️ Amore & Caos</option>
                <option value="bastardo">🔥 Bastardo & Cinico</option>
            </select>
        </div>

        <div id="badgeContainer"></div>

        <div class="display-box" id="displayBox">
            <div class="libro-icona" id="libroIcona"></div>
            <p id="risposta">Hai 2 consultazioni gratuite. Pensa a una domanda e tocca l'oracolo...</p>
        </div>

        <div class="btn-group">
            <div id="contenitoreBottoniApp">
                <button onclick="rivelaRisposta()" style="margin-bottom: 10px;">✨ Sfoglia e Scopri</button>
                <button onclick="lanciaMoneta()" class="btn-secondary" style="margin-bottom: 10px;">🪙 Lancia la Moneta</button>
                <button onclick="pescaDomandaDelGiorno()" class="btn-secondary">📅 Verdetto del Giorno</button>
            </div>
            
            <!-- Pulsante Stripe -->
            <a href="https://buy.stripe.com/4gM00k0ao2pz0v41tQ0VO02" target="_blank" class="btn-link btn-stripe" id="btnStripe" style="display:none;">💳 Sblocca Versione Pro (1,00 €)</a>

            <!-- Casella Codice Sblocco -->
            <div class="sezione-codice" id="sezioneCodice" style="display:none;">
                <input type="text" id="inputCodice" placeholder="Codice Pro">
                <button onclick="riscattaCodice()">Attiva</button>
            </div>

            <!-- Stato Pro Sbloccato -->
            <div id="statusVip" style="display:none; color: #b8860b; font-size: 13px; font-weight: bold; margin: 5px 0; text-transform: uppercase;">✨ Edizione Pro Illimitata Attiva ✨</div>

            <button onclick="condividiWhatsApp()" class="btn-secondary" id="btnCondividi" style="display:none;">📤 Condividi su WhatsApp</button>
        </div>
    </div>

    <!-- Badge dei download dinamico -->
    <div class="downloads-badge">
        📥 Già consultato da <span id="numDownload">1842</span> anime
    </div>

    <script>
        const codiciProValidi = [
            "PRO-7741", "PRO-9923", "PRO-5510", "PRO-3382", "PRO-1149",
            "PRO-8856", "PRO-2237", "PRO-6690", "PRO-4415", "PRO-0098",
            "PRO-1357", "PRO-2468", "PRO-3579", "PRO-4680", "PRO-5791",
            "PRO-6802", "PRO-7913", "PRO-8024", "PRO-9135", "PRO-2026"
        ];

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('vip') === 'lucasegreto' || localStorage.getItem("appProAttivo") === "true") {
            localStorage.setItem("appProAttivo", "true");
        }

        function haAccessoPro() {
            return localStorage.getItem("appProAttivo") === "true";
        }

        function getGiriGratis() {
            let giri = localStorage.getItem("giriGratisRimasti");
            if (giri === null) return 2;
            return parseInt(giri);
        }

        function scalaUnGiro() {
            let giri = getGiriGratis();
            if (giri > 0) {
                localStorage.setItem("giriGratisRimasti", giri - 1);
            }
        }

        window.onload = function() {
            if (haAccessoPro()) {
                document.getElementById("statusVip").style.display = "block";
            } else {
                let giri = getGiriGratis();
                if (giri <= 0) {
                    bloccaAppPerPagamento();
                } else {
                    document.getElementById("risposta").innerText = `Hai ${giri} consultazioni gratuite rimaste! Pensa a una domanda...`;
                }
            }
        };

        function bloccaAppPerPagamento() {
            document.getElementById("contenitoreBottoniApp").style.display = "none";
            document.getElementById("btnStripe").style.display = "block";
            document.getElementById("sezioneCodice").style.display = "block";
            document.getElementById("libroIcona").style.display = "none";
            document.getElementById("risposta").innerText = "🔒 Le pagine gratuite sono esaurite. Sblocca l'accesso illimitato per 1,00 € o inserisci il codice.";
        }

        function riscattaCodice() {
            let codiceInserito = document.getElementById("inputCodice").value.trim().toUpperCase();
            if (codiciProValidi.includes(codiceInserito)) {
                localStorage.setItem("appProAttivo", "true");
                alert("Codice valido! Il libro si è aperto per sempre.");
                location.reload();
            } else {
                alert("Codice non valido. Controlla la ricevuta di Stripe!");
            }
        }

        function verificaPrimaDiAgire() {
            if (haAccessoPro()) return true;
            let giri = getGiriGratis();
            if (giri > 0) {
                scalaUnGiro();
                return true;
            } else {
                bloccaAppPerPagamento();
                return false;
            }
        }

        let downloadTotali = localStorage.getItem("appDownloadCount");
        if (!downloadTotali) {
            downloadTotali = 1842;
        } else {
            downloadTotali = parseInt(downloadTotali) + Math.floor(Math.random() * 3) + 1;
        }
        localStorage.setItem("appDownloadCount", downloadTotali);
        document.getElementById("numDownload").innerText = downloadTotali.toLocaleString();

        const mazzi = {
            mistico: [
                "Assolutamente sì.", "Le probabilità sono a tuo favore.", "Fallo, ma non fartene una colpa.", "È il momento peggiore per farlo.", "Chiedilo a qualcun altro.",
                "Concentrati e chiedilo di nuovo.", "Le stelle dicono di no.", "Segui il tuo istinto senza paura.", "Meglio tacere.", "Non ci contare troppo.",
                "Sì, è scritto nel destino.", "Evita di correre rischi inutili.", "È la scelta giusta.", "Aspetta ancora un po'.", "Assolutamente no.",
                "Fallo subito.", "C'è troppa confusione.", "Riceverai un segno.", "Dipende da te.", "Non è il momento.",
                "Prendi tempo.", "Sì, senza dubbio.", "Prudenza.", "Cerca la semplicità.", "Un salto nel buio."
            ],
            lavoro: [
                "Chiedi un aumento, è il momento giusto.", "Il capo sta osservando: datti da fare.", "Rimanda quel progetto a settimana prossima.", "Cambia lavoro prima che sia tardi.", "C'è una promozione nascosta in arrivo.",
                "Non fidarti di quel collega.", "Investi tempo sulle tue idee.", "Delega di più e stressati meno.", "Un errore del passato ti salverà.", "Accetta quella proposta all'estero.",
                "Il budget è rischioso, fai attenzione.", "Ottime notizie in arrivo dalla direzione.", "Fai una pausa, stai esagerando.", "Il successo richiede ancora molta gavetta.", "Segui la tua passione economica.",
                "Tieni duro, la crisi è quasi finita.", "Cerca un socio con cui dividere il carico.", "Ottimizza i costi e taglia i rami secchi.", "Parla chiaro con i superiori.", "Un colpo di testa ti premierà.",
                "Rimani nella tua zona di comfort per ora.", "C'è un contratto segreto che ti attende.", "Non firmare nulla a scatola chiusa.", "La tua creatività farà la differenza.", "Fidati del tuo piano aziendale."
            ],
            amore: [
                "Scrivigli subito quel messaggio.", "Fatti desiderare di più.", "È la persona giusta, non avere dubbi.", "Lascialo perdere, è un buco nell'acqua.", "C'è un ritorno di fiamma in arrivo.",
                "Troppi drammi inutili: volta pagina.", "Dille quello che provi senza filtri.", "È solo un'infatuazione passeggera.", "Organizza una sorpresa romantica.", "Meglio rimanere amici, per ora.",
                "Il cuore ha ragione, ascoltalo.", "C'è un segreto che non ti sta dicendo.", "Fai il primo passo con coraggio.", "State marciando verso un vicolo cieco.", "La gelosia sta rovinando tutto.",
                "Un incontro inaspettato ti sconvolgerà.", "Fidati di più del tuo partner.", "Cerca l'equilibrio prima di amare.", "Prenditi del tempo per stare da solo.", "L'amore trionferà su tutto.",
                "Non elemosinare attenzioni.", "C'è chi ti pensa in questo istante.", "Chiudi quella porta e aprine un'altra.", "Un bacio cambierà le regole del gioco.", "Vivi alla giornata e goditi il caos."
            ],
            bastardo: [
                "Ma ti rendi conto della cazzata che hai appena pensato?", "Fallo pure, così impari la lezione a tue spese.", "La risposta è no, a meno che tu non voglia umiliarti.", "Anche no, svegliati.", "Hai due neuroni in lotta per il terzo posto.",
                "Chiedilo a tua madre, magari lei ti sopporta.", "Certo, buttati nel fosso che è morbido.", "Ma fatti una vita invece di fare ste domande.", "Pessima idea, come tutte le tue idee del resto.", "Sei talmente fuori strada che ti serve un navigatore.",
                "Ma ti sei guardato allo specchio stamattina?", "Nessuno ti sta ascoltando, rassegnati.", "Sì, vai a sbattere contre il muro, ti farà bene.", "Hai la stessa probabilità di successo di un pinguino nel Sahara.", "Ma chi te lo fa fare di fare figuracce?",
                "La risposta è ovvia, ma sei troppo cieco per vederla.", "Fallo pure, poi però non venire a piangere da me.", "Sei il re indiscusso delle decisioni idiote.", "Ma piantala e vai a dormire.", "Le tue speranze sono meno di zero.",
                "Ti meriti esattamente quello che ti succederà per aver fatto questa domanda.", "Ma per favore, cresci un attimo.", "Sei a un passo dal fare una figura colossale.", "Risposta breve: no. Risposta lunga: assolutamente no.", "Ma ti pagano per essere così pesante?"
            ]
        };

        let ultimaRispostaTesto = "";

        function rivelaRisposta() {
            if (!verificaPrimaDiAgire()) return;
            const categoriaScelta = document.getElementById("mazzoScelto").value;
            const arrayFrasi = mazzi[categoriaScelta];
            
            document.getElementById("badgeContainer").innerHTML = ""; 
            animazioneSfogliaPagina();
            
            const frase = arrayFrasi[Math.floor(Math.random() * arrayFrasi.length)];
            mostraRisposta(frase);
        }

        function lanciaMoneta() {
            if (!verificaPrimaDiAgire()) return;
            document.getElementById("badgeContainer").innerHTML = '<span class="badge-giorno">🪙 Oracolo della Moneta 🪙</span>';
            
            animazioneSfogliaPagina();
            setTimeout(() => {
                const esito = Math.random() < 0.5 ? "Testa! Il destino si avvera." : "Croce! Le sorti si invertono.";
                mostraRisposta(esito);
            }, 300);
        }

        function pescaDomandaDelGiorno() {
            if (!verificaPrimaDiAgire()) return;
            const oggi = new Date().toDateString();
            const salvatoData = localStorage.getItem("dataVerdetto");
            const salvatoTesto = localStorage.getItem("testoVerdetto");
            let frase = "";
            
            if (salvatoData === oggi && salvatoTesto) {
                frase = salvatoTesto;
            } else {
                const arrayFrasi = mazzi.mistico;
                frase = arrayFrasi[Math.floor(Math.random() * arrayFrasi.length)];
                localStorage.setItem("dataVerdetto", oggi);
                localStorage.setItem("testoVerdetto", frase);
            }
            document.getElementById("badgeContainer").innerHTML = '<span class="badge-giorno">✨ Verdetto del Giorno ✨</span>';
            
            animazioneSfogliaPagina();
            mostraRisposta(frase);
        }

        function animazioneSfogliaPagina() {
            const displayBox = document.getElementById("displayBox");
            displayBox.classList.add('sfoglia');
        }

        function mostraRisposta(frase) {
            ultimaRispostaTesto = frase;
            setTimeout(() => {
                const rispostaP = document.getElementById("risposta");
                const displayBox = document.getElementById("displayBox");
                
                rispostaP.innerText = frase;
                displayBox.classList.remove('sfoglia');
                
                document.getElementById("btnCondividi").style.display = "block";

                const msg = new SpeechSynthesisUtterance(frase);
                msg.lang = 'it-IT';
                msg.pitch = 1.1;
                msg.rate = 0.95;
                window.speechSynthesis.speak(msg);
                
            }, 300);
        }

        function condividiWhatsApp() {
            const testoMessaggio = encodeURIComponent(`📖 Il Libro delle Risposte ha parlato per me:\n\n"${ultimaRispostaTesto}"\n\nTenta la fortuna anche tu!`);
            window.open(`https://api.whatsapp.com/send?text=${testoMessaggio}`, '_blank');
        }
    </script>
</body>
</html>
